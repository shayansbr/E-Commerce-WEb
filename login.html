<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Reloop</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="auth-shell">
    <aside class="auth-side">
      <div class="auth-side-top">
        <a href="index.html" class="nav-brand">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2C9 2 7 4.5 7 7.5c0 4 5 12.5 5 12.5s5-8.5 5-12.5C17 4.5 15 2 12 2Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="7.5" r="2" stroke="currentColor" stroke-width="1.6"/></svg>
          Reloop
        </a>
      </div>
      <div class="auth-side-copy">
        <h2>Your devices, back in the loop.</h2>
        <p>Log in to check on your listings, review bids, or track a repair you've booked.</p>
      </div>
      <div class="auth-side-quote">
        Every vendor on Reloop is manually reviewed before they can bid or list repair services.
      </div>
    </aside>

    <main class="auth-main">
      <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="auth-sub">Log in to your Reloop account.</p>

        <div id="form-error" class="form-error"></div>

        <button id="google-btn" class="google-btn" type="button">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.87-3.04.87-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.73A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.19.29-1.73V4.94H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.06l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.94l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
          Continue with Google
        </button>

        <div class="divider">or</div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary btn-block">Log in</button>
        </form>

        <div class="auth-switch">
          Don't have an account? <a href="signup.html">Sign up</a>
        </div>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
